<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrtion Page</title>
  <link rel="stylesheet" type="text/css" href="youtube.css">

</head>
<body>
   <fieldset>
  <div class="container">
      <div class="row">
        <div class="card">
          <div  class="card-header">
          <h2>Sigh Up Form</h2>
          </div>
          <div class="card-body">
            <form action="" method="post">
              <div class="form-group">
                <label for=" first name">First Name</label><br>
                <input type="text" id="first name" name="first name" class="form-control" placeholder="Firstname" required="">
                <br><br>
                 
                   <label for=" middle name">Middle Name</label><br>
                <input type="text" id="middle name" name="middle name" class="form-control" placeholder="Middlename" required="">
                <br><br>
                 
                   <label for=" last name">Last Name</label><br>
                <input type="text" id="last name" name="Last name" class="form-control" placeholder="Lastname/Optional">
                <br><br>
                 <label for="email">Email</label><br>
                 <input type="email" id="email"  class="form-control" placeholder="example@gmail.com" required="">
                   <br><br>

                  <form>
                 <label for="gender">Gender</label>
                 <br>
                 <input type="radio" id="male" class="form-control" name="gender" value="male"  required="">Male
                 <input type="radio" id="female" class="form-control" name="gender" value="female" required="">Female
                 <input type="radio" id="other" class="form-control" name="gender" value="other"  required="">Other
                  </form>

                    <br><br>
                  <label for="phone number">Phone No.</label><br>
                  <select required="">
                    <option>Country Code</option>
                    <option>+254</option>
                    <option>+255</option>
                    <option>+256</option>
                    <option>+251</option>
                    <option>+250</option>
                    <option>+263</option>
                  </select>
                  <input type="number" id="number" class="form-control" name="phone number" placeholder="0123456789" required="">
                   <br><br>
                   <label for="password">Pasword</label><br>
                   <input type="password" id="password" class="form-control" name="password" placeholder="password" required="">
                    <br><br>
                   
                    <label for="Confirm password">Confirm Password</label><br>
                     <input type="password" id="confirm password" class="form-control" name="confirm password" placeholder="comfirm password" required="">
                     <br><br>

                     <label for="submit"></label><br>
                     <input type="submit" id="submit" class="form-control" name="submit" value="submit">
                     
                     <label for="login"></label>
                     <button>Login</button>




              </div>
            </form>
          </div>
          <div class="card-footer">
            <h6>&copy;Vista Duwil 2025</h6>
          </div>
        </div>
        
      </div>
  </div>    

  </fieldset>
</body>
</html>
